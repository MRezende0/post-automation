name: CI

# O que este workflow garante (ADR 0003, mesmo desenho do Saint-Jardin):
#   - toda PR: testes, typecheck da plataforma, as migrations aplicadas (duas vezes)
#     num Postgres limpo sem comando destrutivo escondido, o isolamento por tenant (RLS)
#     testado e a varredura de segredo e de dependência; o job `CI ok` agrega tudo;
#   - merge na main: as migrations pendentes são aplicadas no banco de produção.
#
# A Vercel publica a plataforma por conta própria quando o merge chega na main, e os
# dois disparam ao mesmo tempo. Por isso migration tem que ser ADITIVA (coluna nova,
# tabela nova) e o código tolerar a coluna ainda não existir, como o fallback do
# brief_id em src/utils/queue.js.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo possível. Nenhum job precisa de mais que ler o repositório.
permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: "2.109.1"

jobs:
  test:
    name: Testes e typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nenhum teste abre navegador; baixar o Chromium só deixaria o job lento.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck da plataforma
        working-directory: platform
        run: |
          npm ci
          npx tsc --noEmit -p .

  migrations-check:
    name: Migrations num banco limpo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Migration que apaga dado precisa de um aval explícito no próprio arquivo.
      - name: Sem comando destrutivo sem aval
        run: |
          set -euo pipefail
          falhou=0
          for f in supabase/migrations/*.sql; do
            if grep -qiE '^[[:space:]]*(drop (table|schema|column)|truncate|delete from|alter table [^;]*drop column)' "$f" \
               && ! grep -q -- '-- allow-destructive' "$f"; then
              echo "::error file=$f::comando destrutivo sem '-- allow-destructive' no arquivo"
              falhou=1
            fi
          done
          exit $falhou

      # As migrations antigas usam o que o Supabase já traz (papéis da API, auth.users, auth.uid()).
      # Num Postgres puro, o bootstrap cria o equivalente mínimo. Desde a 0015 nada ativo depende
      # do schema auth, e o teste de RLS reprova se voltar a depender (SPEC 008).
      - name: Base do Supabase
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/ci/bootstrap.sql

      # Duas passadas: a segunda prova que reaplicar é seguro (o banco de produção nunca
      # teve histórico de migrations; a primeira execução automática reaplica as antigas).
      - name: Aplicar todas as migrations, duas vezes
        run: |
          set -euo pipefail
          for passada in 1 2; do
            echo "== passada $passada"
            for f in supabase/migrations/*.sql; do
              echo "-- $f"
              psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      # O banco aceita o que o código grava hoje (colunas novas das últimas migrations).
      - name: O schema aceita o que o código grava
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into briefs (tenant_id, pillar, angle, idea, status)
            values ('pilar', 'dica', 'precificacao', 'ci', 'producing');
          insert into pending_approvals (tenant_id, pending_id, channel, brief_id, generation, status)
            select 'pilar', 'ci-linkedin', 'linkedin', id, '{"variations":[]}', 'rework_requested' from briefs limit 1;
          insert into scheduled_posts (tenant_id, channel, variation, caption_final, scheduled_for, brief_id, media_kind, utm)
            select 'pilar', 'twitter', '{"id":1}', 'ci', now(), id, 'thread', '{"content":"d00000000"}' from briefs limit 1;
          insert into feedback (tenant_id, channel, aspect, sentiment, note)
            values ('pilar', null, 'visual', 'negativo', 'fundo escuro');
          insert into style_rules (tenant_id, rule, aspect, source) values ('pilar', 'sem emoji', 'tom', 'manual');
          insert into publishing_controls (tenant_id, paused) values ('pilar', false)
            on conflict (tenant_id) do update set paused = excluded.paused;
          insert into post_events (tenant_id, post_id, type, payload) values ('pilar', null, 'idea_decision', '{}');
          insert into engagements (tenant_id, kind, target_url, target_urn, parent_comment_urn, target_text, options, status)
            values ('pilar', 'resposta', 'https://www.linkedin.com/feed/update/urn:li:activity:1/', 'urn:li:activity:1',
                    'urn:li:comment:(urn:li:activity:1,2)', 'texto', '["a"]', 'publicado');
          insert into engage_targets (tenant_id, name, profile_url) values ('pilar', 'Ana', 'https://www.linkedin.com/in/ana/');
          insert into notifications (tenant_id, kind, level, title, body, link)
            values ('pilar', 'publish.ok', 'info', 'Publicado no LinkedIn', null, '/history');
          SQL

      # Isolamento por tenant provado como o app acessa (authenticated com JWT), não como
      # superuser. Também barra tabela sem RLS, grant para anon e SECURITY DEFINER aberto.
      - name: RLS por tenant
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/ci/rls_test.sql

  security:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Catraca: varre só os commits novos. O histórico antigo tem falsos positivos
      # conhecidos (placeholders de .env.example e o exemplo de assinatura da doc do X).
      - name: Varredura de segredo nos commits novos
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          ./gitleaks git . --no-banner --redact --log-opts="$range"

      # A raiz (jobs do GitHub Actions) bloqueia a partir de "alta". A plataforma, que fica
      # exposta na internet, bloqueia "crítica": o que sobra nela é o PostCSS embutido no
      # Next 15 (só em build, corrige no Next 16, mudança maior que entra à parte).
      - name: Dependências da raiz
        run: npm audit --omit=dev --audit-level=high
      - name: Dependências da plataforma
        working-directory: platform
        run: npm audit --omit=dev --audit-level=critical

  # Único check obrigatório na proteção da main: agrega os outros, então job novo entra
  # aqui sem mexer na configuração do GitHub.
  ci-ok:
    name: CI ok
    if: always()
    needs: [test, migrations-check, security]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::algum job do CI não passou"
            exit 1
          fi

  migrate:
    name: Migrations em produção
    needs: [ci-ok]
    # Só no push para a main: PR nunca enxerga o segredo do banco.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O segredo SUPABASE_DB_URL vive neste environment. Para exigir um clique de
    # aprovação antes de aplicar, adicione "Required reviewers" nele no GitHub.
    environment: Production
    # Duas execuções nunca aplicam migration ao mesmo tempo, e cancelar um `db push`
    # no meio é pior que esperar o anterior.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Sem o segredo, falha dizendo o que configurar (em vez de um erro de conexão).
      - name: Segredo do banco configurado
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Configure o segredo SUPABASE_DB_URL (Session Pooler, IPv4) no environment Production"
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # SUPABASE_DB_URL deve ser o Session Pooler (IPv4): a conexão direta do Supabase
      # é IPv6 e o runner do GitHub não alcança.
      - name: Migrations pendentes (dry-run)
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Aplicar migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
