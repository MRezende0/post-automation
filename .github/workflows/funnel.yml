name: Funnel

# Coleta diária do funil da Pilar (SPEC 004): cadastros, ativados e pagantes por UTM dos
# últimos 120 dias, gravados em funnel_daily e em posts.funnel (recompensa do bandit).
on:
  schedule:
    # 09:30 UTC = 06:30 BRT
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Collect Pilar funnel
        env:
          PILAR_FUNCTIONS_URL: ${{ secrets.PILAR_FUNCTIONS_URL }}
          OPS_EXPORT_TOKEN: ${{ secrets.OPS_EXPORT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND }}
        run: npm run funnel
