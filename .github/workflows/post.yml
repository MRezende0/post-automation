name: Post

on:
  schedule:
    # Seg, qua, sex às 12:00 UTC = 09:00 BRT
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar em modo dry-run (sem APIs reais)?'
        type: boolean
        default: false
      skip_approval:
        description: 'Pular aprovação Telegram e publicar top-1?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run post pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_APPROVAL: ${{ inputs.skip_approval }}
        run: npm start

      - name: Commit content updates
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "post-automation[bot]"
          git config user.email "post-automation@users.noreply.github.com"
          git add content/
          git diff --staged --quiet || git commit -m "chore: update content state after run"
          git push
