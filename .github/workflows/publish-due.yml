name: publish-due

# Dispara o scheduler da plataforma a cada 10min. Substitui o Vercel Cron (que no
# plano Hobby só roda 1x/dia). O endpoint busca scheduled_posts vencidos e publica.
# Secrets necessários no repo: PLATFORM_URL (ex: https://post-automation.vercel.app)
# e CRON_SECRET (o mesmo configurado nas env vars do Vercel).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# evita acumular execuções se uma atrasar
concurrency:
  group: publish-due
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/publish-due
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PLATFORM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure os secrets PLATFORM_URL e CRON_SECRET no repositório."
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            "$PLATFORM_URL/api/cron/publish-due" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          # 2xx = ok; qualquer outro = falha (alerta no Actions)
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
