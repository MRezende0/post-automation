name: Reflection (learn from edits)

on:
  schedule:
    # Domingo, 22:00 UTC = 19:00 BRT (1h antes do weekly report)
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Deriva regras de estilo a partir das edições humanas no cockpit
      # (scheduled_posts.caption_final vs a legenda sugerida) e grava em
      # style_rules. No-op sem edições/sem API. Não escreve no repo, só no DB.
      - name: Derive style rules from human edits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND }}
        run: npm run reflect
