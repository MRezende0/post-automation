name: Weekly report

on:
  schedule:
    # Domingo, 23:00 UTC = 20:00 BRT
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generate weekly report
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND }}
        run: npm run metrics

      - name: Commit metrics + few-shot updates
        run: |
          git config user.name "post-automation[bot]"
          git config user.email "post-automation@users.noreply.github.com"
          git add content/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update metrics e few-shot examples"
          git pull --rebase origin main
          git push
