# Campanhas temáticas por período. A campanha ATIVA hoje tem prioridade sobre
# feriado e rotação (mas não sobre item explícito da fila com pillar definido).
#
# Schema:
#   - name: string                 # nome da campanha (aparece no log/contexto)
#     start: YYYY-MM-DD             # opcional (sem start = desde sempre)
#     end: YYYY-MM-DD               # opcional (sem end = pra sempre)
#     pillar: dor | dica | building | prova   # opcional — força o pilar
#     angle: <ângulo válido>        # opcional — ver docs/pilares.md
#     context: |                    # tema injetado no prompt
#       ...
#
# Para uma SÉRIE ordenada com datas, use content/queue.yaml com `scheduled_for`
# (1 item por dia). O calendário cobre o tema do período; a fila cobre a ordem.
#
# Desliga via env CAMPAIGN_AWARE=false.

# Calendário até o lançamento de 19/01/2027. Fonte: docs/plano-presenca-social.md §4.
# A fase A (20/10 a 15/11) não tem campanha: roda a rotação por pilar para medir
# a linha de base de cada formato.
- name: Quanto custa um projeto
  start: 2026-11-16
  end: 2026-12-20
  context: |
    Série de dica e dor sobre custo real de projeto: hora do sócio, revisões não
    cobradas, retrabalho por versão errada, prazo que estoura. Cada peça mostra uma
    conta concreta e termina com a pergunta "você sabe esse número no seu escritório?".
    Escritório de projeto de engenharia e arquitetura, nunca construtora.
- name: Planeje 2027
  start: 2026-12-21
  end: 2027-01-04
  context: |
    Conteúdo leve de virada de ano: o que medir em 2027, quais projetos repetir,
    qual cliente não aceitar de novo. Sem venda direta.
- name: Pré-lançamento
  start: 2027-01-05
  end: 2027-01-18
  context: |
    Bastidores da reta final e contagem regressiva para 19/01. Mostra trechos reais do
    produto e o porquê de cada decisão. CTA: entrar na turma de lançamento.
- name: Lançamento
  start: 2027-01-19
  end: 2027-01-25
  context: |
    A Pilar está aberta. Tagline "Saiba se cada projeto está dando lucro antes de
    terminar." Mostra o fluxo proposta, projeto, cobrança, lucro. CTA: testar grátis
    por 3 dias.
- name: Prova
  start: 2027-01-26
  end: 2027-02-18
  context: |
    Casos dos primeiros escritórios (só com autorização escrita), objeções respondidas
    e tutoriais curtos por módulo.
