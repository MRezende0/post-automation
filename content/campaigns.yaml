# Campanhas temáticas por período. A campanha ATIVA hoje tem prioridade sobre
# feriado e rotação (mas não sobre item explícito da fila com pillar definido).
#
# Schema:
#   - name: string                 # nome da campanha (aparece no log/contexto)
#     start: YYYY-MM-DD             # opcional (sem start = desde sempre)
#     end: YYYY-MM-DD               # opcional (sem end = pra sempre)
#     pillar: dor | dica | building | prova   # opcional — força o pilar
#     angle: <ângulo válido>        # opcional — ver docs/pilares.md
#     context: |                    # tema injetado no prompt
#       ...
#
# Para uma SÉRIE ordenada com datas, use content/queue.yaml com `scheduled_for`
# (1 item por dia). O calendário cobre o tema do período; a fila cobre a ordem.
#
# Desliga via env CAMPAIGN_AWARE=false.

# >>> AJUSTE AS DATAS antes de usar. Como estão no futuro, esta campanha NÃO
#     dispara até a janela chegar — e mesmo assim passa pela sua aprovação.
- name: Semana do Lucro por Projeto
  start: 2026-06-09
  end: 2026-06-15
  context: |
    Tema da semana: o diferencial nº 1 do Pilar — saber, em tempo real, se cada
    projeto dá lucro. Gancho de topo: planilha/feeling não respondem "esse projeto
    valeu a pena?". Promessa de fundo: lucro por projeto na tela, do lead ao
    recebimento. Cada post puxa uma faceta (orçar no feeling, fechar o mês no
    escuro, projeto que drena margem) e termina conectando ao controle real.
    Mantenha o foco em engenharia de projeto (não obra).
