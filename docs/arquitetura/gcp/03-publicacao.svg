<rect x="40" y="410" width="1630" height="130" rx="14" fill="#F3FAF5" stroke="#2E8B57" stroke-width="1.6"/>
<text x="54" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start">Por que não duplica nem trava</text>
<text x="62" y="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B1F24" text-anchor="start">1. A trava no banco acontece antes de chamar a rede.</text>
<text x="892" y="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B1F24" text-anchor="start">2. O worker responde 200 mesmo se a rede falhar: a falha vai para o banco, não volta para a fila.</text>
<text x="62" y="504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B1F24" text-anchor="start">3. Publicação e comentário nunca são repetidos sozinhos.</text>
<text x="892" y="504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B1F24" text-anchor="start">4. Uma fila por rede: lentidão ou limite de uma não atrasa as outras.</text>
