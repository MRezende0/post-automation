<text x="1567.5" y="200.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Pessoas</text>
<text x="1567.5" y="220.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">buscar por e-mail, contas e papéis,</text>
<text x="1567.5" y="240.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">reenviar convite, sair de tudo, zerar MFA</text>
