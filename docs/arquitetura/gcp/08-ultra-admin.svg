<text x="777.5" y="620.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Atividade</text>
<text x="777.5" y="640.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">audit log: suas ações e as</text>
<text x="777.5" y="660.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">ações sensíveis das contas</text>
<rect x="985" y="575" width="375" height="120" rx="10" fill="#E6F4EA" stroke="#2E8B57" stroke-width="2"/>
<text x="1172.5" y="620.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Pedidos LGPD</text>
<text x="1172.5" y="640.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">exportação e exclusão</text>
<text x="1172.5" y="660.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">com prazo</text>
<rect x="1380" y="575" width="375" height="120" rx="10" fill="#F1F2F4" stroke="#8A929B" stroke-width="2"/>
<text x="1567.5" y="620.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Teste grátis</text>
<text x="1567.5" y="640.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">quem está no teste; estender</text>
<text x="1567.5" y="660.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">com motivo; retenção depois</text>
<rect x="570" y="730" width="1206" height="240" rx="14" fill="#F3FAF5" stroke="#2E8B57" stroke-width="1.6"/>
<text x="584" y="752" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E8B57" text-anchor="start">Garantias de exclusividade (testadas no CI)</text>
<text x="592" y="780" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">1. platform_admins aceita no máximo uma linha (constraint de linha única).</text>
<text x="592" y="811" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">2. Nenhum grant para a API: só migration revisada em PR grava ali; nenhuma tela promove ninguém.</text>
<text x="592" y="842" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">3. Separado dos papéis de conta: nenhum administrador de cliente vira ultra admin por engano.</text>
<text x="592" y="873" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">4. O console não abre bypass no RLS: lê por funções do servidor, e cada ação vai para o audit log.</text>
<text x="592" y="904" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">5. Impersonação com sessão no servidor, motivo, 30 min e banner; nunca mostra token de rede.</text>
<text x="592" y="935" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">6. Tentativa negada vira e-mail para você na hora.</text>
<text x="24" y="1010" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6570" text-anchor="start">Diferença para a Pilar: lá o ultra_admin é um valor da mesma coluna de papel das empresas, protegido por trigger.</text>
<text x="24" y="1036" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6570" text-anchor="start">Aqui ele mora numa tabela própria, de uma linha só, com dois portões a mais (e-mail fixo e IAP).</text>
</svg>
