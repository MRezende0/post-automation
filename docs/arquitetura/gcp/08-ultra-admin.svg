<rect x="1380" y="435" width="375" height="120" rx="10" fill="#F1F2F4" stroke="#8A929B" stroke-width="2"/>
<text x="1567.5" y="480.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Feedback e incidentes</text>
<text x="1567.5" y="500.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">o que os clientes mandaram</text>
<text x="1567.5" y="520.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">e o que quebrou</text>
