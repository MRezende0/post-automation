<rect x="1380" y="295" width="375" height="120" rx="10" fill="#E0F4F4" stroke="#138A8A" stroke-width="2"/>
<text x="1567.5" y="340.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Operação</text>
<text x="1567.5" y="360.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">filas e jobs, saúde por rede,</text>
<text x="1567.5" y="380.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">pausa global, desligar uma rede</text>
<rect x="590" y="435" width="375" height="120" rx="10" fill="#E0F4F4" stroke="#138A8A" stroke-width="2"/>
<text x="777.5" y="480.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Custos de IA e mídia</text>
<text x="777.5" y="500.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">por conta, por rede e por dia;</text>
<text x="777.5" y="520.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">limite que dispara alerta</text>
<rect x="985" y="435" width="375" height="120" rx="10" fill="#E0F4F4" stroke="#138A8A" stroke-width="2"/>
<text x="1172.5" y="480.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="middle">Cobrança</text>
<text x="1172.5" y="500.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6570" text-anchor="middle">assinaturas, inadimplência,</text>
