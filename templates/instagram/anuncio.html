<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #1d4ed8;
    --fg: #ffffff;
    --accent: #fbbf24;
    --muted: #c7d2fe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg, #1d4ed8 0%, #1e3a8a 100%);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 110px 90px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    color: var(--accent);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .title {
    font-size: 84px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 36px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 880px;
  }
  .cta {
    display: inline-block;
    padding: 30px 50px;
    background: var(--accent);
    color: #1e3a8a;
    font-size: 32px;
    font-weight: 700;
    border-radius: 8px;
    width: fit-content;
  }
  .footer {
    display: flex; justify-content: space-between;
    color: var(--muted);
    font-size: 22px;
  }
  .brand { font-weight: 700; color: var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">{{eyebrow}}</div>
    <div>
      <h1 class="title">{{title}}</h1>
    </div>
    <p class="subtitle">{{subtitle}}</p>
    <div class="cta">{{cta}}</div>
    <div class="footer">
      <span class="brand">{{brand}}</span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
