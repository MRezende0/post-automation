<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #18181b;
    --fg: #fafafa;
    --accent: #facc15;
    --muted: #a1a1aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--bg); color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 130px 100px;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 50px;
  }
  .mark {
    font-size: 200px;
    line-height: 0.7;
    color: var(--accent);
    font-family: Georgia, serif;
  }
  .quote {
    font-size: 60px;
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: -0.015em;
  }
  .attr {
    color: var(--muted);
    font-size: 28px;
    margin-top: 30px;
  }
  .footer {
    margin-top: auto;
    display: flex; justify-content: space-between;
    color: var(--muted);
    font-size: 22px;
  }
  .brand { font-weight: 700; color: var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">"</div>
    <p class="quote">{{quote}}</p>
    <p class="attr">— {{attribution}}</p>
    <div class="footer">
      <span class="brand">{{brand}}</span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
