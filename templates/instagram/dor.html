<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0f1115;
    --fg: #f5f5f4;
    --accent: #ef4444;
    --muted: #a1a1aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--bg); color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 110px 90px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(160deg, #0f1115 0%, #1a1d24 100%);
  }
  .badge {
    display: inline-block;
    padding: 12px 22px;
    background: var(--accent);
    color: white;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-radius: 4px;
    width: fit-content;
  }
  .hook {
    font-size: 76px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .body {
    font-size: 32px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 880px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted);
    font-size: 22px;
  }
  .brand {
    font-weight: 700; color: var(--fg);
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <span class="badge">{{badge}}</span>
    </div>
    <div>
      <h1 class="hook">{{hook}}</h1>
    </div>
    <div>
      <p class="body">{{subline}}</p>
    </div>
    <div class="footer">
      <span class="brand">{{brand}}</span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
