<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  /* Híbrido: fundo ilustrado (IA, nano banana) + texto sobreposto (marca Pilar). */
  :root { --ink: #1A1A1A; --paper: #FCFCFC; --brand: #A4EC86; --muted: #CFCFCF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 1080px; height: 1350px;
    background-image: url({{bg}});
    background-size: cover; background-position: center;
    background-color: var(--paper);
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  /* Overlay pra dar contraste ao texto na metade de baixo. */
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(26,26,26,0) 38%, rgba(26,26,26,0.55) 60%, rgba(26,26,26,0.92) 100%);
  }
  .content { position: relative; z-index: 1; padding: 90px; }
  .badge {
    display: inline-block; padding: 12px 24px; margin-bottom: 28px;
    background: var(--brand); color: var(--ink);
    font-size: 22px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; border-radius: 999px;
  }
  .hook {
    font-size: 76px; font-weight: 800; line-height: 1.08;
    letter-spacing: -0.025em; color: #fff;
  }
  .footer {
    position: relative; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 90px 70px; color: var(--muted); font-size: 22px;
  }
  .brandwrap { display: flex; align-items: center; gap: 14px; }
  .brand { font-weight: 700; color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <span class="badge">{{badge}}</span>
      <h1 class="hook">{{hook}}</h1>
    </div>
  </div>
  <div class="footer">
    <span class="brandwrap">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <g transform="translate(2,4)" stroke="#A4EC86" stroke-width="1.6" stroke-linecap="round">
          <line x1="1" y1="2" x2="27" y2="2" />
          <line x1="3" y1="6" x2="25" y2="6" opacity="0.85" />
          <line x1="7" y1="9" x2="7" y2="23" />
          <line x1="12" y1="9" x2="12" y2="23" />
          <line x1="17" y1="9" x2="17" y2="23" />
          <line x1="22" y1="9" x2="22" y2="23" />
        </g>
      </svg>
      <span class="brand">{{brand}}</span>
    </span>
    <span>{{handle}}</span>
  </div>
</body>
</html>
