<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  /* Foto-pergunta: croqui técnico em tinta sobre papel + uma pergunta curta.
     Cores vêm do tenant (brand_css). Plano de presença social §2. */
  {{{brand_css}}}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 1080px; height: 1350px;
    padding: 96px 90px 84px;
    display: flex; flex-direction: column;
    /* papel milimetrado discreto, como prancha */
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 54px 54px;
    background-position: -1px -1px;
  }
  .card::before {
    /* esmaece a grade no centro para o croqui respirar */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, var(--paper) 45%, transparent 85%);
  }
  .card > * { position: relative; }
  .eyebrow {
    align-self: flex-start;
    font-size: 24px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent-ink);
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 10px 22px; background: var(--paper);
  }
  .sketch {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 0 30px;
  }
  .sketch svg { width: 660px; height: 660px; color: var(--ink); overflow: visible; }
  .sketch svg .accent { fill: var(--accent); }
  .sketch svg .accent-stroke { stroke: var(--accent); }
  .question {
    font-size: 76px; font-weight: 800; line-height: 1.06; letter-spacing: -0.03em;
    color: var(--ink);
    max-width: 900px;
    text-wrap: balance;
  }
  .footer {
    margin-top: 56px;
    border-top: 2px solid var(--ink);
    padding-top: 30px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 24px; color: var(--muted);
  }
  .brandwrap { display: flex; align-items: center; gap: 14px; }
  .brand { font-weight: 700; color: var(--ink); }
  .reply { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="sketch">{{{sketch}}}</div>
    <h1 class="question">{{question}}</h1>
    <div class="footer">
      <span class="brandwrap">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <g transform="translate(2,4)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color: var(--ink)">
            <line x1="1" y1="2" x2="27" y2="2" />
            <line x1="3" y1="6" x2="25" y2="6" opacity="0.85" />
            <line x1="7" y1="9" x2="7" y2="23" />
            <line x1="12" y1="9" x2="12" y2="23" />
            <line x1="17" y1="9" x2="17" y2="23" />
            <line x1="22" y1="9" x2="22" y2="23" />
          </g>
        </svg>
        <span class="brand">{{brand}}</span>
        <span>{{handle}}</span>
      </span>
      <span class="reply">{{cta}}</span>
    </div>
  </div>
</body>
</html>
