<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0c1410;
    --fg: #f0fdf4;
    --accent: #22c55e;
    --muted: #94a3a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--bg); color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 120px 100px;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 44px;
    background: linear-gradient(155deg, #0c1410 0%, #112a1c 100%);
  }
  .badge {
    display: inline-block;
    padding: 12px 22px;
    background: var(--accent);
    color: #052e16;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-radius: 4px;
    width: fit-content;
  }
  .stars { font-size: 40px; letter-spacing: 6px; color: var(--accent); }
  .quote {
    font-size: 58px;
    line-height: 1.28;
    font-weight: 500;
    letter-spacing: -0.015em;
  }
  .attr {
    color: var(--muted);
    font-size: 28px;
    margin-top: 10px;
  }
  .footer {
    margin-top: auto;
    display: flex; justify-content: space-between;
    color: var(--muted);
    font-size: 22px;
  }
  .brand { font-weight: 700; color: var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">{{badge}}</span>
    <div class="stars">★★★★★</div>
    <p class="quote">{{quote}}</p>
    <p class="attr">— {{attribution}}</p>
    <div class="footer">
      <span class="brand">{{brand}}</span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
