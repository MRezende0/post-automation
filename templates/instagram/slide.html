<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  /* Slide de carrossel: capa, item numerado ou fechamento ({{kind}}). O mesmo PNG vira
     página do PDF do LinkedIn. Cores do tenant (brand_css). */
  {{{brand_css}}}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 96px 90px 84px;
    display: flex; flex-direction: column;
  }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 700; }
  .badge {
    color: var(--accent-ink); letter-spacing: 0.12em; text-transform: uppercase;
    border: 2px solid var(--ink); border-radius: 999px; padding: 10px 22px;
  }
  .page { color: var(--muted); font-variant-numeric: tabular-nums; }
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .num {
    width: 150px; height: 150px; border-radius: 50%;
    background: var(--accent); border: 4px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 76px; font-weight: 800; letter-spacing: -0.04em;
  }
  .title { font-size: 84px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
  .description { font-size: 40px; line-height: 1.45; color: var(--ink-soft); max-width: 900px; text-wrap: pretty; }
  .rule { width: 120px; height: 12px; border-radius: 999px; background: var(--accent); }
  .hint { font-size: 30px; font-weight: 700; color: var(--ink); }
  .footer {
    border-top: 2px solid var(--ink); padding-top: 30px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 24px; color: var(--muted);
  }
  .brandwrap { display: flex; align-items: center; gap: 14px; }
  .brand { font-weight: 700; color: var(--ink); }

  /* capa: título maior, sem número */
  .capa .num, .capa .description:empty { display: none; }
  .capa .title { font-size: 104px; }
  /* item: número em destaque */
  .item .rule, .item .hint { display: none; }
  /* fechamento: centralizado, sem número */
  .fim .num, .fim .rule { display: none; }
  .fim .body { align-items: flex-start; }
  .capa .hint-item, .fim .hint-item { display: none; }
  .item .description:empty, .fim .description:empty { display: none; }
</style>
</head>
<body>
  <div class="card {{kind}}">
    <div class="top">
      <span class="badge">{{badge}}</span>
      <span class="page">{{step}}</span>
    </div>
    <div class="body">
      <div class="num">{{number}}</div>
      <h1 class="title">{{title}}</h1>
      <div class="rule"></div>
      <p class="description">{{description}}</p>
      <p class="hint">{{hint}}</p>
    </div>
    <div class="footer">
      <span class="brandwrap">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <g transform="translate(2,4)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color: var(--ink)">
            <line x1="1" y1="2" x2="27" y2="2" />
            <line x1="3" y1="6" x2="25" y2="6" opacity="0.85" />
            <line x1="7" y1="9" x2="7" y2="23" />
            <line x1="12" y1="9" x2="12" y2="23" />
            <line x1="17" y1="9" x2="17" y2="23" />
            <line x1="22" y1="9" x2="22" y2="23" />
          </g>
        </svg>
        <span class="brand">{{brand}}</span>
      </span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
