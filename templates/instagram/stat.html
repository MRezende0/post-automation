<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  /* Paleta Pilar — ver docs/brand.md */
  :root {
    --paper: #FCFCFC;
    --ink: #1A1A1A;
    --ink-soft: #3C3C3C;
    --muted: #6B6B6B;
    --brand: #A4EC86;
    --brand-ink: #2C5016;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 110px 90px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(160deg, #FCFCFC 0%, #F2F2EF 100%);
  }
  .label {
    color: var(--brand-ink);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .number {
    font-size: 260px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.05em;
    color: var(--ink);
  }
  .unit {
    font-size: 60px;
    font-weight: 700;
    margin-top: 20px;
    color: var(--brand-ink);
  }
  .description {
    font-size: 36px;
    line-height: 1.4;
    max-width: 880px;
    color: var(--ink-soft);
  }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted);
    font-size: 22px;
  }
  .brandwrap { display: flex; align-items: center; gap: 14px; }
  .brand { font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="label">{{label}}</div>
    <div>
      <div class="number">{{number}}</div>
      <div class="unit">{{unit}}</div>
    </div>
    <p class="description">{{description}}</p>
    <div class="footer">
      <span class="brandwrap">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <g transform="translate(2,4)" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round">
            <line x1="1" y1="2" x2="27" y2="2" />
            <line x1="3" y1="6" x2="25" y2="6" opacity="0.85" />
            <line x1="7" y1="9" x2="7" y2="23" />
            <line x1="12" y1="9" x2="12" y2="23" />
            <line x1="17" y1="9" x2="17" y2="23" />
            <line x1="22" y1="9" x2="22" y2="23" />
          </g>
        </svg>
        <span class="brand">{{brand}}</span>
      </span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
