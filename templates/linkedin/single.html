<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  /* Paleta Pilar — ver docs/brand.md */
  :root {
    --paper: #FCFCFC;
    --ink: #1A1A1A;
    --ink-soft: #3C3C3C;
    --muted: #6B6B6B;
    --brand: #A4EC86;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 627px;
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .card {
    width: 1200px; height: 627px;
    padding: 70px 80px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(135deg, #FCFCFC 0%, #F2F2EF 100%);
  }
  .accent-bar {
    width: 80px; height: 10px;
    background: var(--brand);
    border-radius: 999px;
  }
  .hook {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.025em;
    max-width: 1000px;
    color: var(--ink);
  }
  .sub {
    font-size: 26px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 1000px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted);
    font-size: 20px;
  }
  .brandwrap { display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="accent-bar"></div>
    <h1 class="hook">{{hook}}</h1>
    <p class="sub">{{subline}}</p>
    <div class="footer">
      <span class="brandwrap">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <g transform="translate(2,4)" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round">
            <line x1="1" y1="2" x2="27" y2="2" />
            <line x1="3" y1="6" x2="25" y2="6" opacity="0.85" />
            <line x1="7" y1="9" x2="7" y2="23" />
            <line x1="12" y1="9" x2="12" y2="23" />
            <line x1="17" y1="9" x2="17" y2="23" />
            <line x1="22" y1="9" x2="22" y2="23" />
          </g>
        </svg>
        <span class="brand">{{brand}}</span>
      </span>
      <span>{{handle}}</span>
    </div>
  </div>
</body>
</html>
